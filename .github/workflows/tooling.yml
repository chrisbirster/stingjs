name: Check · Tooling

on:
  workflow_call:
  workflow_dispatch:

jobs:
  cli:
    name: CLI · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install CLI dependencies
        working-directory: tooling/cli
        run: npm install
      - name: Typecheck
        working-directory: tooling/cli
        run: npm run typecheck
      - name: Test
        working-directory: tooling/cli
        run: npm test
