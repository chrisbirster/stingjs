name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build StingRuntime for iOS Simulator
        working-directory: native/ios
        run: xcodebuild -scheme StingRuntime -destination 'generic/platform=iOS Simulator' build
      - name: Build StingHaptics for iOS Simulator
        working-directory: packages/modules/haptics
        run: xcodebuild -scheme StingHaptics -destination 'generic/platform=iOS Simulator' build
