name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test portable JavaScript engine probes
        run: node benchmarks/js-engine/engine-bench.js

  runtime-engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          echo "$expected  /tmp/zig.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build and run official QuickJS through Zig
        run: bash runtime/prototypes/quickjs/run-host.sh
      - name: Build and run QuickJS-NG through Zig
        run: bash runtime/prototypes/quickjs-ng/run-host.sh

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - name: Prove Solid-to-native loop in JavaScriptCore
        run: npm run test:ios-runtime
      - name: Build StingRuntime for iOS Simulator
        working-directory: native/ios
        run: xcodebuild -scheme StingRuntime -destination 'generic/platform=iOS Simulator' build
      - name: Build StingHaptics for iOS Simulator
        working-directory: packages/modules/haptics
        run: xcodebuild -scheme StingHaptics -destination 'generic/platform=iOS Simulator' build
      - name: Build hello-world iOS application
        run: xcodebuild -project examples/hello-world/ios/StingHelloWorld.xcodeproj -scheme StingHelloWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
