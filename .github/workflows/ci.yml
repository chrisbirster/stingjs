name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

# Engine policy:
# - Official QuickJS is Sting's production JavaScript engine and is a required CI gate.
# - QuickJS-NG and Hermes are comparison/experimental lanes only and must never block feature PRs.
# - The React Native/Hermes baseline is benchmark evidence only and must never block Sting changes.

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test portable JavaScript engine probes
        run: node benchmarks/js-engine/engine-bench.js

  runtime-quickjs-smoke:
    name: Runtime ${{ matrix.engine }} smoke
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: quickjs
            experimental: false
          - engine: quickjs-ng
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Install Sting workspace dependencies
        run: npm install
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          echo "$expected  /tmp/zig.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build and run ${{ matrix.engine }} through Zig
        run: bash "runtime/prototypes/${{ matrix.engine }}/run-host.sh"

  runtime-hermes-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Install Sting workspace dependencies
        run: npm install
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          echo "$expected  /tmp/zig.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Build and run Hermes V1 through isolated C ABI and Zig
        run: bash runtime/prototypes/hermes/run-host.sh

  react-native-baseline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Generate pinned bare React Native 0.87 baseline
        env:
          STING_RN_BASELINE_DIR: ${{ runner.temp }}/StingRNBenchmark
        run: bash benchmarks/react-native-benchmark/scripts/generate.sh
      - name: Typecheck baseline workload
        working-directory: ${{ runner.temp }}/StingRNBenchmark
        run: npx tsc --noEmit
      - name: Produce release Metro bundle
        working-directory: ${{ runner.temp }}/StingRNBenchmark
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output ${{ runner.temp }}/index.android.bundle --assets-dest ${{ runner.temp }}/rn-assets
      - name: Build Android release baseline and physical-evidence instrumentation with Hermes
        working-directory: ${{ runner.temp }}/StingRNBenchmark/android
        run: ./gradlew :app:assembleRelease :app:assembleAndroidTest --no-daemon
      - name: Verify release APK and instrumentation APK
        run: |
          test -f ${{ runner.temp }}/StingRNBenchmark/android/app/build/outputs/apk/release/app-release.apk
          find ${{ runner.temp }}/StingRNBenchmark/android/app/build/outputs/apk/androidTest -name '*.apk' -type f | grep -q .

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Install Sting workspace dependencies
        run: npm install
      - name: Build hello-world and benchmark Sting bundles
        run: |
          npm run build --workspace @stingjs/example-hello-world
          npm run build --workspace @stingjs/benchmark-native
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          echo "$expected  /tmp/zig.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Compile Android production host, release app, and instrumentation APKs
        working-directory: examples/hello-world/android
        run: gradle :app:assembleDebug :app:assembleRelease :app:assembleAndroidTest :sting-runtime:assembleDebugAndroidTest --no-daemon
      - name: Verify official QuickJS is packaged in the normal application
        run: |
          test -f examples/hello-world/android/app/build/outputs/apk/release/app-release.apk
          unzip -l examples/hello-world/android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/sting-app.js'
          unzip -l examples/hello-world/android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/sting-benchmark.js'
          unzip -l examples/hello-world/android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/arm64-v8a/libsting_quickjs_android.so'
          unzip -l examples/hello-world/android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'lib/x86_64/libsting_quickjs_android.so'
          if unzip -l examples/hello-world/android/app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'libsting_quickjs_ng_android.so'; then
            echo 'QuickJS-NG must not be packaged in the normal Sting Android application' >&2
            exit 1
          fi
          find examples/hello-world/android/app/build/outputs/apk/androidTest -name '*.apk' -type f | grep -q .
      - name: Prove prebuilt Android host is consumable without Zig
        run: |
          bash scripts/package-android-host.sh "${{ runner.temp }}/sting-android-host"
          bash scripts/test-android-distributable-host.sh "${{ runner.temp }}/sting-android-host"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android native instrumentation
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: cd examples/hello-world/android && gradle :app:connectedAndroidTest :sting-runtime:connectedDebugAndroidTest --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - name: Prove Solid-to-native loop in JavaScriptCore
        run: npm run test:ios-runtime
      - name: Build StingRuntime for iOS Simulator
        working-directory: native/ios
        run: xcodebuild -scheme StingRuntime -destination 'generic/platform=iOS Simulator' build
      - name: Build StingHaptics for iOS Simulator
        working-directory: packages/modules/haptics
        run: xcodebuild -scheme StingHaptics -destination 'generic/platform=iOS Simulator' build
      - name: Build hello-world iOS application
        run: xcodebuild -project examples/hello-world/ios/StingHelloWorld.xcodeproj -scheme StingHelloWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
