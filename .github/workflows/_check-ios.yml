name: Check · iOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  ios:
    name: iOS Runtime + Sting Go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm install
      - name: Test StingRuntime only
        run: bash scripts/test-ios-runtime.sh --runtime-only
      - name: Prove official QuickJS production runtime on iOS
        run: npm run test:ios-quickjs-runtime
      - name: Test Sting Go iOS protocol and reload support
        working-directory: apps/sting-go/ios/Support
        run: swift test
      - name: Build and launch Sting Go on iOS Simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(
            xcrun simctl list devices available \
              | grep -m1 -E 'iPhone .*[0-9A-Fa-f-]{36}' \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'
          )"
          test -n "$DEVICE_ID"
          rm -rf /tmp/sting-go-ios-derived
          xcodebuild \
            -project apps/sting-go/ios/StingGo.xcodeproj \
            -scheme StingGo \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/sting-go-ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" /tmp/sting-go-ios-derived/Build/Products/Debug-iphonesimulator/StingGo.app
          xcrun simctl launch "$DEVICE_ID" run.stingjs.go
          xcrun simctl openurl "$DEVICE_ID" 'sting://go?url=http%3A%2F%2F127.0.0.1%3A8081%2Fmanifest'
      - name: Package Sting Go iOS Simulator developer client
        run: bash scripts/package-sting-go.sh ios /tmp/sting-go-artifacts
      - name: Verify packaged Sting Go iOS metadata
        run: |
          set -euo pipefail
          test "$(find /tmp/sting-go-artifacts -maxdepth 1 -name 'sting-go-v*-ios-simulator.zip' -type f | wc -l | tr -d ' ')" = "1"
          unzip -l "$(find /tmp/sting-go-artifacts -maxdepth 1 -name 'sting-go-v*-ios-simulator.zip' -type f | head -n1)" | grep -F 'StingGo.app/' >/dev/null
          node -e 'const m=require("/tmp/sting-go-artifacts/sting-go-ios-simulator.json"); if(m.product!=="sting-go"||m.platform!=="ios-simulator"||m.releaseKind!=="developer-client"||!/^[a-f0-9]{64}$/.test(m.sha256)) process.exit(1)'
      - name: Build StingRuntime for iOS Simulator
        working-directory: native/ios
        run: xcodebuild -scheme StingRuntime -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build StingQuickJSRuntime for iOS Simulator
        working-directory: native/ios/QuickJSRuntime
        run: xcodebuild -scheme StingQuickJSRuntime -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Package distributable production iOS host
        run: bash scripts/package-ios-host.sh /tmp/sting-ios-host
      - name: Prove distributable iOS host builds without Zig
        run: bash scripts/test-ios-distributable-host.sh /tmp/sting-ios-host
