name: Release v0.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release v0.1 must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm install
      - name: Verify release tag matches repository version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${RELEASE_TAG}" = "v${version}"
      - name: Run TypeScript, tests, and builds
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Enforce physical-device runtime decision gate
        run: npm run release:check:v0.1
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"
      - name: Install Gradle
        run: brew install gradle
      - name: Build Android release smoke artifact
        working-directory: examples/hello-world/android
        run: gradle :app:assembleRelease --no-daemon
      - name: Build iOS native host
        run: xcodebuild -project examples/hello-world/ios/StingHelloWorld.xcodeproj -scheme StingHelloWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp examples/hello-world/android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/stingjs-hello-world-v0.1.0-android-unsigned.apk
          cp examples/hello-world/dist/sting-app.js release-artifacts/sting-app.js
          cp CHANGELOG.md release-artifacts/CHANGELOG.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
