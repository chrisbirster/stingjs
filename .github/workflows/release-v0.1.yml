name: Release v0.1

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Release v0.1 must run from main, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - name: Verify release tag matches repository version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${RELEASE_TAG}" = "v${version}"
      - name: Run repository software gate
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Enforce physical-device runtime decision gate
        run: npm run release:check:v0.1
      - name: Stage JavaScript bundle and changelog
        run: |
          mkdir -p release-artifacts
          cp examples/hello-world/dist/sting-app.js release-artifacts/sting-app.js
          cp CHANGELOG.md release-artifacts/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: v0.1-common
          path: release-artifacts/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - name: Build shared Sting bundle
        run: npm run build --workspace @stingjs/example-hello-world
      - name: Install Android SDK and pinned NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install pinned Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          expected="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          curl --fail --location --silent --show-error "$url" --output /tmp/zig.tar.xz
          echo "$expected  /tmp/zig.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Build Android release smoke artifact
        working-directory: examples/hello-world/android
        run: gradle :app:assembleRelease --no-daemon
      - name: Stage Android artifact
        run: |
          mkdir -p release-artifacts
          cp examples/hello-world/android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/stingjs-hello-world-v0.1.0-android-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: v0.1-android
          path: release-artifacts/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global npm@12.0.2
      - run: npm install
      - name: Build shared Sting bundle
        run: npm run build --workspace @stingjs/example-hello-world
      - name: Run iOS native runtime tests
        run: npm run test:ios-runtime
      - name: Build iOS native host
        run: xcodebuild -project examples/hello-world/ios/StingHelloWorld.xcodeproj -scheme StingHelloWorld -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  release:
    runs-on: ubuntu-latest
    needs:
      - verify
      - android
      - ios
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v0.1-common
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: v0.1-android
          path: release-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
